---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 23 * * 6'  # Saturdays at 23:00 UTC
  push:
    branches:
      - main
      - 'ics410*'
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # PR refs are <number>/merge; slashes are invalid in image tags.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            DEFAULT_TAG="pr-${PR_NUMBER}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            DEFAULT_TAG=$(just generate-default-tag)
          else
            DEFAULT_TAG="${GITHUB_REF_NAME,,}"
          fi

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # Docker credentials are also used by the unprivileged signing step.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: >
          github.event_name != 'pull_request' &&
          (
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
            startsWith(github.ref_name, 'ics410')
          )
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Authenticate the rootful Podman used for pulls, rechunking and pushes.
      - name: Login rootful Podman to GitHub Container Registry
        if: >
          github.event_name != 'pull_request' &&
          (
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
            startsWith(github.ref_name, 'ics410')
          )
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | sudo podman login \
            --authfile "$RUNNER_TEMP/ghcr-auth.json" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/ghcr-auth.json" >> "$GITHUB_ENV"

      # This actually builds the container image
      - name: Build Image
        id: build-image
        env:
          L01_PRIVATE_KEY: ${{ secrets.L01_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          export WORKBOOK_SSH_KEY_FILE GITHUB_API_TOKEN_FILE
          GITHUB_API_TOKEN_FILE=
          WORKBOOK_SSH_KEY_FILE=$(mktemp "$RUNNER_TEMP/workbook-key.XXXXXX")
          trap 'rm -f "$WORKBOOK_SSH_KEY_FILE" "${GITHUB_API_TOKEN_FILE:-}"' EXIT
          GITHUB_API_TOKEN_FILE=$(mktemp "$RUNNER_TEMP/github-token.XXXXXX")
          test -n "$GITHUB_TOKEN"
          printf '%s\n' "$GITHUB_TOKEN" > "$GITHUB_API_TOKEN_FILE"
          unset GITHUB_TOKEN
          test -n "$L01_PRIVATE_KEY"
          printf '%s\n' "$L01_PRIVATE_KEY" > "$WORKBOOK_SSH_KEY_FILE"
          unset L01_PRIVATE_KEY
          sudo -E $(command -v just) build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Rechunk with Chunkah
        id: rechunk
        run: |
          sudo -E $(command -v just) rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          sudo -E $(command -v just) tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: Push To GHCR
        if: >
          github.event_name != 'pull_request' &&
          (
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
            startsWith(github.ref_name, 'ics410')
          )
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            sudo -E podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: >
          github.event_name != 'pull_request' &&
          (
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
            startsWith(github.ref_name, 'ics410')
          )
        # https://github.com/containers/container-libs/issues/388
        with:
          cosign-release: 'v2.6.3'

      - name: Sign container image
        id: sign-image
        if: >
          github.event_name != 'pull_request' &&
          (
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
            startsWith(github.ref_name, 'ics410')
          )
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      - name: Remove registry credentials
        if: always()
        run: sudo rm -f "$RUNNER_TEMP/ghcr-auth.json"
