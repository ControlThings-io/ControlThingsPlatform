# ControlThings

hide_ascii = false
key_color = "Yellow"
separator = ""
#separator_color = "White"
spacing = 2
padding = 0

[custom_ascii]
color = "Yellow"
path = "~/.config/macchina/ascii/ControlThings.ascii"

[bar]
visible = true
glyph = "○"
#symbol_open = '['
#symbol_close = ']'
#hide_delimiters = true

[box]
visible = true
border = "rounded"
title = "─── ControlThings Platform "

[box.inner_margin]
x = 1
y = 0

[randomize]
key_color = false
separator_color = false

